name: Lean builds and email

# Runs after every Daily feed run. It builds the Lean projects linked from the newest issue,
# stores the results in data/lean.json (Deploy site then publishes them), and sends the issue
# as a Kit broadcast. Each step does nothing when there is nothing new.
on:
  workflow_run:
    workflows: ["Daily feed"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Build the Lean projects of this day (YYYY-MM-DD) instead of the newest"
        required: false
      force:
        description: "Comma-separated repositories to build again, such as owner/repo"
        required: false

permissions:
  contents: read

concurrency:
  group: lean-builds
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: List the Lean projects to build
        id: plan
        env:
          DAY: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m paperlane lean-plan --updates ${DAY:+--date "$DAY"} --force "$FORCE"

  # The build runs the authors' code, so this job gets no token and no secrets. It only
  # writes a result file, which the publish job checks field by field before storing it.
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 150
    # A repository whose build crashes the machine is stored as an error by the publish job,
    # so it should not mark the whole run as failed and send GitHub's failure email.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Mathlib's compiled files take several gigabytes.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.repo }}
        env:
          REPO: ${{ matrix.repo }}
          PROJECT: ${{ matrix.path }}
        run: python -m paperlane lean-run --repo "$REPO" --path "$PROJECT" --out result --minutes 90

      - name: Keep the end of the log
        if: always()
        run: tail -c 200000 result/build.log > result/build-tail.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lean-${{ strategy.job-index }}
          path: |
            result/result.json
            result/build-tail.log
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.count != '0'
        with:
          pattern: lean-*
          path: results

      - name: Store the results
        id: record
        if: needs.plan.outputs.count != '0'
        env:
          PLANNED: ${{ needs.plan.outputs.matrix }}
        run: |
          python -m paperlane lean-record --folder results --expect "$PLANNED" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lean.json data/lean-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Lean build results"
            git pull --rebase
            git push
          fi

      # The code licence of every checked repository, so readers know whether they may reuse it.
      - name: Look up code licences
        id: licences
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m paperlane licenses
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/licenses.json
          if ! git diff --cached --quiet; then
            git commit -m "Update the code licences of Lean repositories"
            git pull --rebase
            git push
          fi


      # Sends once per issue, and only on the day of the issue. Until the repository variable
      # DIGEST_SEND is set to true, each email waits in Kit as a draft for a look first.
      - name: Send the email
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          SEND: ${{ vars.DIGEST_SEND }}
        run: |
          # Deploy site runs at the same time as this workflow. Wait up to 15 minutes for the
          # live site to show the newest issue, so the email never links to a page that is not up yet.
          newest=$(ls data/days | sort | tail -1 | cut -c1-10)
          for i in $(seq 30); do
            live=$(curl -sf --max-time 20 https://pragyaangaur.dev/Paperlane/latest.json | python -c "import json,sys; print(json.load(sys.stdin).get('date',''))" || true)
            [ "$live" = "$newest" ] && break
            echo "live site shows ${live:-nothing} and the newest issue is $newest; waiting"
            sleep 30
          done
          if [ "$SEND" = "true" ]; then python -m paperlane digest --send; else python -m paperlane digest; fi
          git add data/digests.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record the email for $(date -u +%F)"
            git pull --rebase
            git push
          fi
