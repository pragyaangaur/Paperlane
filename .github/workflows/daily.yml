name: Daily feed

on:
  schedule:
    # arXiv announces at 20:00 US Eastern, but its RSS feed is rebuilt at midnight
    # Eastern (04:00 UTC in summer, 05:00 UTC in winter). 06:28 UTC is after both, and stays off the busy :00 and :30 slots.
    - cron: "28 6 * * *"
    # Two backup runs. Each one reads the feed again and only does work when the night
    # is not stored yet or the live site is behind. The 08:28 run is the last one, and
    # it fails (so GitHub emails you) when a weekday still has no issue.
    - cron: "28 7 * * *"
    - cron: "28 8 * * *"
  # A push that changes the code or the stored days rebuilds the site without fetching.
  push:
    branches: [main]
    paths: ["paperlane/**", "data/days/**", "data/lean.json", ".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      api_date:
        description: "Backfill a day (YYYY-MM-DD) from the arXiv API instead of the RSS feed"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      stale: ${{ steps.live.outputs.stale }}
      site: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest

      - name: Fetch tonight's papers
        id: fetch
        if: github.event_name != 'push'
        # A failed fetch should not fail the run. The next backup run tries again, and
        # the last run of the day reports a missing issue.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DATE: ${{ inputs.api_date }}
        run: |
          if [ -n "$API_DATE" ]; then
            python -m paperlane fetch --api-date "$API_DATE"
          else
            python -m paperlane fetch
          fi

      - name: Commit the stored day
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days
          git commit -m "Add papers for ${{ steps.fetch.outputs.date }}"
          git pull --rebase
          git push

      - name: Note a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning title=Fetch failed::The next backup run will try again."

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Catches a deploy that failed after the day was committed, so a backup run deploys it.
      - name: Compare with the live site
        id: live
        if: github.event_name == 'schedule'
        run: python -m paperlane check --site "${{ steps.pages.outputs.base_url }}"

      - name: Build the site
        if: steps.fetch.outputs.changed == 'true' || steps.live.outputs.stale == 'true' || github.event_name != 'schedule'
        env:
          # Set this repository variable to a GoatCounter site code to turn on visitor counts.
          PAPERLANE_GOATCOUNTER: ${{ vars.GOATCOUNTER_CODE }}
          # Set this repository variable to a Kit form id to show the email sign-up form.
          PAPERLANE_KIT_FORM: ${{ vars.KIT_FORM_ID }}
        run: python -m paperlane build --out _site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        if: steps.fetch.outputs.changed == 'true' || steps.live.outputs.stale == 'true' || github.event_name != 'schedule'
        with:
          path: _site
          # Keeps .nojekyll, which this action drops by default since v4.
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || needs.build.outputs.stale == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Only the last scheduled run of the day reports, so a failure that a backup run fixed
  # sends no email. A failed job here makes GitHub email the repository owner.
  report:
    needs: [build, deploy]
    if: always() && github.event.schedule == '28 8 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that today's issue is live
        run: |
          sleep 60
          python -m paperlane check --final --site "${{ needs.build.outputs.site || 'https://pragyaangaur.github.io/Paperlane' }}"
