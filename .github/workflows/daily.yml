name: Daily feed

on:
  schedule:
    # arXiv announces at 20:00 US Eastern, but its RSS feed is rebuilt at midnight
    # Eastern (04:00 UTC in summer, 05:00 UTC in winter). 06:28 UTC is after both, and stays off the busy :00 and :30 slots.
    - cron: "28 6 * * *"
    # Two backup runs. Each one reads the feed again and only does work when the night
    # is not stored yet or the live site is behind. The 08:28 run is the last one, and
    # it fails (so GitHub emails you) when a weekday still has no issue.
    - cron: "28 7 * * *"
    - cron: "28 8 * * *"
  # A push that changes the code runs the tests. Deploy site builds and publishes it.
  push:
    branches: [main]
    paths: ["paperlane/**", "tests/**", ".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      api_date:
        description: "Backfill a day (YYYY-MM-DD) from the arXiv API instead of the RSS feed"
        required: false

# This workflow only fetches and commits. Deploy site runs after it and publishes the site.
permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest

      - name: Fetch tonight's papers
        id: fetch
        if: github.event_name != 'push'
        # A failed fetch should not fail the run. The next backup run tries again, and
        # the last run of the day reports a missing issue.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DATE: ${{ inputs.api_date }}
        run: |
          if [ -n "$API_DATE" ]; then
            python -m paperlane fetch --api-date "$API_DATE"
          else
            # arXiv sometimes publishes the feed hours late, so an empty weekday feed is read
            # again every 15 minutes for up to three hours.
            python -m paperlane fetch --wait 180
          fi

      - name: Commit the stored day
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days
          git commit -m "Add papers for ${{ steps.fetch.outputs.date }}"
          git pull --rebase
          git push

      - name: Note a failed fetch
        if: steps.fetch.outcome == 'failure'
        run: echo "::warning title=Fetch failed::The next backup run will try again."
